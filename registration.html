<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Registration - VIVIDHATA CLUB</title>
  <meta name="description" content="Event registration from Vividhata Club." />
  <link rel="icon" type="image/png" href="viviLogo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;800&family=Zen+Kaku+Gothic+New:wght@300;500;900&family=Cinzel:wght@400;700;900&family=Space+Grotesk:wght@300;400;500;700;800;900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>

<body class="event-detail-page registration-page">
  <div class="grain" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <header class="chrome">
    <div class="chrome__mark">
      <a href="index.html" class="event-page-brand">
        <img src="viviLogo.png" alt="Vividhata Logo" class="nav__logo" />
        <span>VIVIDHATA</span>
      </a>
    </div>
    <div class="chrome__actions"><a href="events.html" class="event-page-home" aria-label="Back to Events">EVENTS</a>
    </div>
    <nav class="chrome__nav" aria-label="Main navigation">
      <a href="index.html" data-sub="01">HOME</a>
      <a href="index.html#about" data-sub="02">ABOUT</a>
      <a href="events.html" class="active" data-sub="03">EVENTS</a>
      <a href="gallery.html" data-sub="04">GALLERY</a>
      <a href="mailto:vividhata@glbitm.ac.in" data-sub="05">CONTACT</a>
    </nav>
  </header>
  <header class="phone-header">
    <a href="events.html" class="event-page-mobile-back">BACK TO EVENTS</a>
    <span class="phone-header__title">VIVIDHATA</span>
  </header>

  <main class="event-detail-container registration-container" id="registrationContent" aria-live="polite"></main>

  <script src="events-data.js"></script>
  <script src="registration-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script>
    console.log("QRCode library:", typeof QRCode);
    console.log("QRCode.toDataURL:", typeof QRCode?.toDataURL);
  </script>
  <script>
    const registrationRoot = document.getElementById('registrationContent');
    const eventId = new URLSearchParams(window.location.search).get('event');
    const eventUtils = window.VIVIDHATA_EVENT_UTILS;
    const event = eventUtils ? eventUtils.getEventById(eventId) : null;

    if (!event) {
      registrationRoot.innerHTML = '<section class="event-detail-empty"><span class="event-detail__eyebrow">REGISTRATION / 404</span><h1>EVENT NOT FOUND</h1><p>This registration placeholder is not linked to a known event.</p><a class="event-detail__button event-detail__button--primary" href="events.html">BACK TO EVENTS</a></section>';
    } else {
      const text = value => eventUtils.escapeHtml(value);
      document.title = `Registration - ${event.name}`;
      const registrationState = eventUtils.getRegistrationState(event);
      const external = eventUtils.isExternalRegistrationUrl(event.registrationUrl);
      const isClosed = registrationState === 'closed';
      const isOpen = registrationState === 'open';
      const isDisabled = registrationState === 'disabled';
      const fileFields = (event.registration?.fields || []).filter(field => field.type === 'file');
      const fileFieldMarkup = fileFields.length ? `
            <section class="event-form-section">
              <h2>DOCUMENTS</h2>
              <div class="event-form-grid">
                ${fileFields.map(field => `<label class="event-form-field event-form-field--full">${text(field.label)}${field.required ? ' *' : ''}<input name="${text(field.id)}" type="file" accept="${text((field.acceptExtensions || []).join(','))}"${field.required ? ' required' : ''}><span class="event-form-error" data-error-for="${text(field.id)}"></span></label>`).join('')}
              </div>
            </section>` : '';
      const continueAction = isOpen
        ? `<a class="event-detail__button event-detail__button--primary" href="${text(event.registrationUrl)}"${external ? ' target="_blank" rel="noopener noreferrer"' : ''}>CONTINUE TO REGISTRATION</a>`
        : '';
      registrationRoot.innerHTML = `
        <section class="registration-panel">
          <a class="event-detail-back registration-panel__back-to-event" href="event-details.html?event=${encodeURIComponent(event.id)}">&larr; BACK TO EVENT</a>
          <div class="registration-panel__layout registration-panel__layout--intro">
            <div class="registration-panel__poster">
              <img src="${text(event.poster)}" alt="${text(event.posterAlt)}">
            </div>
            <div class="registration-panel__content">
              <span class="event-detail__eyebrow">${text(event.category)} / REGISTRATION</span>
              <h1>${isClosed ? 'REGISTRATION CLOSED' : isDisabled ? 'REGISTRATION UNAVAILABLE' : 'REGISTER FOR'}</h1>
              <h2 class="registration-panel__event-name">${text(event.name)}</h2>
              <p>${isClosed ? 'This event has been completed and registrations are no longer being accepted.' : isDisabled ? 'Registration is not enabled for this event.' : isOpen ? 'Continue to the official registration page or complete the front-end registration form below.' : 'The official registration link has not been published yet. This front-end form is available for demonstration and will be connected to the official submission system later.'}</p>
              <div class="registration-panel__event">${text(event.name)} <span>${text(event.status)}</span></div>
              <div class="registration-panel__facts">
                <div><span>DATE</span><strong>${text(event.date)}</strong></div>
                <div><span>TIME</span><strong>${text(event.time)}</strong></div>
                <div><span>VENUE</span><strong>${text(event.venue)}</strong></div>
                <div><span>DEADLINE</span><strong>${text(event.deadline)}</strong></div>
                ${event.prize ? `<div><span>PRIZE</span><strong>${text(event.prize)}</strong></div>` : ''}
              </div>
              ${continueAction}
            </div>
          </div>
          ${isClosed || isDisabled ? '' : `
          <div class="registration-form-intro">
            <span class="event-detail__eyebrow">SECURE REGISTRATION / GOOGLE SHEETS</span>
            <p>Your details will be sent securely to the registration service and recorded for club organizers.</p>
          </div>
          <form class="event-registration-form" id="eventRegistrationForm" novalidate>
            <section class="event-form-section">
              <h2>PERSONAL INFORMATION</h2>
              <div class="event-form-grid">
                <label class="event-form-field">FULL NAME *<input name="fullName" type="text" placeholder="Enter your full name" autocomplete="name"><span class="event-form-error" data-error-for="fullName"></span></label>
                <label class="event-form-field">EMAIL ADDRESS *<input name="email" type="email" placeholder="Enter your email address" autocomplete="email"><span class="event-form-error" data-error-for="email"></span></label>
                <label class="event-form-field">CONTACT NUMBER *<input name="contact" type="tel" placeholder="Enter your contact number" autocomplete="tel"><span class="event-form-error" data-error-for="contact"></span></label>
                <label class="event-form-field">COLLEGE / INSTITUTION *<input name="college" type="text" placeholder="Enter your college or institution" autocomplete="organization"><span class="event-form-error" data-error-for="college"></span></label>
                <label class="event-form-field">COURSE / BRANCH<input name="course" type="text" placeholder="Enter your course / branch"></label>
                <label class="event-form-field">YEAR OF STUDY<select name="year"><option value="">Select year</option><option>1ST YEAR</option><option>2ND YEAR</option><option>3RD YEAR</option><option>4TH YEAR</option><option>POSTGRADUATE</option></select></label>
              </div>
            </section>
            <section class="event-form-section">
              <h2>TEAM INFORMATION</h2>
              <div class="event-form-grid">
                <label class="event-form-field">TEAM NAME<input name="teamName" type="text" placeholder="Enter team name"></label>
                <label class="event-form-field">TEAM SIZE<select name="teamSize"><option value="">Select team size</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5+</option></select></label>
                <label class="event-form-field event-form-field--full">TEAM MEMBERS<textarea name="teamMembers" rows="3" placeholder="Add team member names"></textarea></label>
              </div>
            </section>
            <section class="event-form-section">
              <h2>ADDITIONAL INFORMATION</h2>
              <div class="event-form-grid">
                <label class="event-form-field event-form-field--full">WHY DO YOU WANT TO PARTICIPATE?<textarea name="motivation" rows="4" placeholder="Tell us why you want to participate"></textarea></label>
                <label class="event-form-field event-form-field--full">ADDITIONAL INFORMATION<textarea name="additional" rows="3" placeholder="Optional"></textarea></label>
              </div>
            </section>
            ${fileFieldMarkup}
            <section class="event-form-section event-form-section--agreement">
              <h2>AGREEMENT</h2>
              <label class="event-form-check"><input name="accuracy" type="checkbox"><span>I confirm that the information provided is correct. *</span></label>
              <span class="event-form-error" data-error-for="accuracy"></span>
              <label class="event-form-check"><input name="rules" type="checkbox"><span>I agree to the event rules and guidelines. *</span></label>
              <span class="event-form-error" data-error-for="rules"></span>
              <button class="event-detail__button event-detail__button--primary event-form-submit" type="submit">SUBMIT REGISTRATION</button>
              <p class="event-form-server-error" id="eventFormServerError" role="alert"></p>
            </section>
          </form>
          <section class="event-form-success event-pass" hidden aria-live="polite">
            <span class="event-detail__eyebrow">${text(event.category)} / CONFIRMED</span>
            <h2>REGISTRATION CONFIRMED</h2>
            <p>Your registration has been recorded successfully. Present this pass at the venue for check-in.</p>
            <div class="event-pass__card">
              <div class="event-pass__card-header">
                <span class="event-pass__brand">VIVIDHATA CLUB</span>
                <span class="event-pass__tag">EVENT REGISTRATION PASS</span>
              </div>
              <h3 class="event-pass__event-name">${text(event.name)}</h3>
              <div class="event-pass__body">
                <div class="event-pass__details">
                  <div><span>CANDIDATE NAME</span><strong id="eventPassName"></strong></div>
                  <div><span>REGISTRATION ID</span><strong id="eventPassId"></strong></div>
                  <div><span>DATE</span><strong>${text(event.date)}</strong></div>
                  <div><span>TIME</span><strong>${text(event.time)}</strong></div>
                  <div><span>VENUE</span><strong>${text(event.venue)}</strong></div>
                </div>
                <div class="event-pass__qr-wrap">
                  <img class="event-pass__qr" id="eventPassQr" alt="Registration QR code" width="200" height="200">
                </div>
              </div>
              <p class="event-pass__note">Present this pass at the venue for check-in.</p>
            </div>
            <button class="event-detail__button event-detail__button--primary event-pass__download" id="eventPassDownload" type="button" disabled>DOWNLOAD PASS</button>
          </section>`}
          <a class="event-detail-back registration-panel__back" href="events.html">&larr; BACK TO EVENTS</a>
        </section>`;

      if (!isClosed && !isDisabled) {
        const form = document.getElementById('eventRegistrationForm');
        const success = registrationRoot.querySelector('.event-form-success');
        const serverError = document.getElementById('eventFormServerError');
        const submitButton = form.querySelector('.event-form-submit');
        const showError = (name, message) => {
          const error = form.querySelector(`[data-error-for="${name}"]`);
          const field = form.elements[name];
          if (error) error.textContent = message;
          if (field) field.classList.toggle('event-form-input--invalid', Boolean(message));
        };
        form.querySelectorAll('input, select, textarea').forEach(field => {
          field.addEventListener('input', () => showError(field.name, ''));
          field.addEventListener('change', () => showError(field.name, ''));
        });
        form.addEventListener('submit', submitEvent => {
          submitEvent.preventDefault();
          const values = Object.fromEntries(new FormData(form).entries());
          let valid = true;
          const checks = {
            fullName: [values.fullName?.trim(), 'FULL NAME IS REQUIRED'],
            email: [/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(values.email || ''), 'ENTER A VALID EMAIL ADDRESS'],
            contact: [/^[+\d][\d\s().-]{6,}$/.test(values.contact?.trim() || ''), 'ENTER A VALID CONTACT NUMBER'],
            college: [values.college?.trim(), 'COLLEGE / INSTITUTION IS REQUIRED'],
            accuracy: [form.elements.accuracy.checked, 'PLEASE CONFIRM YOUR INFORMATION'],
            rules: [form.elements.rules.checked, 'PLEASE AGREE TO THE EVENT RULES']
          };
          Object.entries(checks).forEach(([name, [passed, message]]) => {
            showError(name, passed ? '' : message);
            if (!passed) valid = false;
          });
          if (!valid) {
            form.querySelector('.event-form-input--invalid, input:not(:checked)')?.focus();
            return;
          }
          const formData = new FormData(form);
          formData.set('eventId', event.id);
          formData.set('accuracy', String(form.elements.accuracy.checked));
          formData.set('rules', String(form.elements.rules.checked));
          serverError.textContent = '';
          submitButton.disabled = true;
          submitButton.textContent = 'SUBMITTING...';
          fetch(window.VIVIDHATA_REGISTRATION_API_URL || '/api/register', {
            method: 'POST',
            body: formData
          })
            .then(async response => {
              const result = await response.json().catch(() => ({}));
              if (!response.ok) throw new Error(result.error || 'Registration could not be completed right now');
              return result;
            })
            .then(result => {
              console.log('Backend response:', result);
              console.log('Registration ID:', result.registrationId);
              form.hidden = true;
              success.hidden = false;
              const candidateName = (values.fullName || '').trim();
              const regId = result.registrationId || '';
              document.getElementById('eventPassName').textContent = candidateName || '—';
              document.getElementById('eventPassId').textContent = regId || 'PENDING';
              renderRegistrationPass({
                regId,
                candidateName,
                eventName: event.name,
                date: event.date,
                time: event.time,
                venue: event.venue
              });
              success.scrollIntoView({ behavior: 'smooth', block: 'start' });
            })
            .catch(error => {
              serverError.textContent = error.message || 'Registration could not be completed right now. Please try again.';
            })
            .finally(() => {
              submitButton.disabled = false;
              submitButton.textContent = 'SUBMIT REGISTRATION';
            });
        });
      }
    }

    // ---- Registration pass (QR code + downloadable image) ----
    // The QR payload is exactly the registrationId returned by the backend.
    // No personal information (email, phone, college, team, etc.) is ever encoded.
    function renderRegistrationPass(details) {
      const qrImg = document.getElementById('eventPassQr');
      const downloadBtn = document.getElementById('eventPassDownload');

      if (!qrImg || !downloadBtn) {
        console.error('QR elements not found');
        return;
      }

      if (!details.regId) {
        console.error('No registration ID received:', details);
        return;
      }

      if (typeof QRCode === 'undefined') {
        console.error('QRCode library is not loaded');
        return;
      }

      console.log('Generating QR for:', details.regId);

      QRCode.toDataURL(
        details.regId,
        {
          width: 480,
          margin: 1,
          color: {
            dark: '#0a0a0a',
            light: '#ffffff'
          }
        },
        function (error, qrDataUrl) {
          if (error) {
            console.error('QR generation failed:', error);
            return;
          }

          console.log('QR generated successfully');

          // Show QR on the registration pass
          qrImg.src = qrDataUrl;

          downloadBtn.disabled = false;

          downloadBtn.onclick = async () => {
            downloadBtn.disabled = true;
            downloadBtn.textContent = 'PREPARING...';

            try {
              const blob = await buildPassImage({
                ...details,
                qrDataUrl
              });

              if (!blob) {
                throw new Error('Failed to create pass image');
              }

              const url = URL.createObjectURL(blob);
              const link = document.createElement('a');

              link.href = url;
              link.download = `VIVIDHATA-Pass-${details.regId}.png`;

              document.body.appendChild(link);
              link.click();
              link.remove();

              setTimeout(() => URL.revokeObjectURL(url), 4000);

            } catch (error) {
              console.error('Pass generation failed:', error);
            } finally {
              downloadBtn.disabled = false;
              downloadBtn.textContent = 'DOWNLOAD PASS';
            }
          };
        }
      );
    }

    function loadImageAsync(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = src;
      });
    }

    // Draws left-aligned wrapped text starting at (x, y) and returns the y
    // position immediately below the last drawn line.
    function drawWrappedText(ctx, textValue, x, y, maxWidth, lineHeight) {
      const words = String(textValue || '').split(/\s+/).filter(Boolean);
      let line = '';
      let currentY = y;
      words.forEach(word => {
        const testLine = line ? `${line} ${word}` : word;
        if (ctx.measureText(testLine).width > maxWidth && line) {
          ctx.fillText(line, x, currentY);
          line = word;
          currentY += lineHeight;
        } else {
          line = testLine;
        }
      });
      if (line) {
        ctx.fillText(line, x, currentY);
        currentY += lineHeight;
      }
      return currentY;
    }

    async function buildPassImage({ regId, candidateName, eventName, date, time, venue, qrDataUrl }) {
      if (document.fonts && document.fonts.ready) {
        try { await document.fonts.ready; } catch (e) { /* fonts API unavailable, continue anyway */ }
      }

      const width = 900;
      const height = 1360;
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      const centerX = width / 2;

      ctx.fillStyle = '#050506';
      ctx.fillRect(0, 0, width, height);

      ctx.strokeStyle = 'rgba(255, 106, 61, 0.55)';
      ctx.lineWidth = 3;
      ctx.strokeRect(24, 24, width - 48, height - 48);

      const accentGradient = ctx.createLinearGradient(24, 0, width - 24, 0);
      accentGradient.addColorStop(0, '#ff2b2b');
      accentGradient.addColorStop(1, '#9d121d');
      ctx.fillStyle = accentGradient;
      ctx.fillRect(24, 24, width - 48, 8);

      let y = 110;
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ff6a3d';
      ctx.font = '800 28px "Space Grotesk", sans-serif';
      ctx.fillText('VIVIDHATA CLUB', centerX, y);

      y += 40;
      ctx.fillStyle = 'rgba(232, 228, 220, 0.72)';
      ctx.font = '700 18px "Space Grotesk", sans-serif';
      ctx.fillText('EVENT REGISTRATION PASS', centerX, y);

      y += 50;
      ctx.strokeStyle = 'rgba(232, 228, 220, 0.18)';
      ctx.beginPath();
      ctx.moveTo(90, y);
      ctx.lineTo(width - 90, y);
      ctx.stroke();

      y += 70;
      ctx.fillStyle = '#ffffff';
      ctx.font = '700 42px "Shippori Mincho", serif';
      y = drawWrappedText(ctx, eventName, centerX, y, width - 180, 50);

      y += 30;
      ctx.fillStyle = '#e8e4dc';
      ctx.font = '600 30px "Zen Kaku Gothic New", sans-serif';
      y = drawWrappedText(ctx, candidateName || '—', centerX, y, width - 180, 38);

      y += 20;
      ctx.fillStyle = '#ff6a3d';
      ctx.font = '700 22px "Space Grotesk", sans-serif';
      ctx.fillText(`REGISTRATION ID: ${regId}`, centerX, y);

      y += 55;

      const qrSize = 420;
      const qrX = centerX - qrSize / 2;
      const qrY = y;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(qrX - 22, qrY - 22, qrSize + 44, qrSize + 44);

      const qrImage = await loadImageAsync(qrDataUrl);
      ctx.drawImage(qrImage, qrX, qrY, qrSize, qrSize);

      let footerY = qrY + qrSize + 90;
      ctx.strokeStyle = 'rgba(232, 228, 220, 0.18)';
      ctx.beginPath();
      ctx.moveTo(90, footerY - 45);
      ctx.lineTo(width - 90, footerY - 45);
      ctx.stroke();

      ctx.textAlign = 'left';
      [['DATE', date], ['TIME', time], ['VENUE', venue]].forEach(([label, value]) => {
        ctx.fillStyle = 'rgba(229, 168, 85, 0.78)';
        ctx.font = '700 15px "Space Grotesk", sans-serif';
        ctx.fillText(label, 90, footerY);
        ctx.fillStyle = '#ffffff';
        ctx.font = '600 20px "Space Grotesk", sans-serif';
        ctx.fillText(value || '-', 240, footerY);
        footerY += 42;
      });

      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(232, 228, 220, 0.68)';
      ctx.font = 'italic 18px "Shippori Mincho", serif';
      ctx.fillText('Present this pass at the venue for check-in.', centerX, footerY + 40);

      return new Promise(resolve => canvas.toBlob(blob => resolve(blob), 'image/png'));
    }
  </script>
</body>

</html>
